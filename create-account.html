<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create Account | MUST Application System</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h1 class="title">Mbarara University of Science and Technology</h1>

  <!-- CREATE ACCOUNT SCREEN -->
  <form class="card" action="#" method="post">
    <h2 class="center">Create Account</h2>
    <p class="note">Enter your details below.</p>

    <label for="surname">Surname</label>
    <input type="text" id="surname" placeholder="Enter your surname" required>

    <label for="othername">Other Name</label>
    <input type="text" id="othername" placeholder="Enter your other name(s)" required>

    <label for="phone">Phone Number</label>
    <input type="tel" id="phone" placeholder="07XXXXXXXX" pattern="07[0-9]{8}" title="Example: 0712345678" required>

    <label for="email">Email Address</label>
    <input type="email" id="email" placeholder="name@mail.com" required>

    <button type="submit" class="btn btn-dark">Create Account</button>

    <a href="index.html" class="back">&larr; Back to Sign In</a>

    <p class="footer">MUST Application System | Welcome.</p>
  </form>

</body>
</html>
