<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mbarara University of Science and Technology</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h1 class="title">Mbarara University of Science and Technology</h1>

  <!-- LOGIN SCREEN -->
  <form class="card" action="#" method="post">
    <h2>Hello and Welcome, Please Enter your credentials</h2>

    <label for="email">Email Address</label>
    <input type="email" id="email" placeholder="name@mail.com" required>

    <label for="password">Password</label>
    <input type="password" id="password" placeholder="Enter your Password" required>

    <button type="submit" class="btn btn-dark">Sign In</button>

    <p class="new">Are you new here?</p>
    <a href="create-account.html" class="btn btn-light">Create Account</a>

    <p class="footer">MUST Application System | Welcome.</p>
  </form>

</body>
</html>
